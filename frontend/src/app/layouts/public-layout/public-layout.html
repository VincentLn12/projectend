<div class="flex min-h-screen flex-col">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <a routerLink="/" class="text-lg font-semibold text-slate-900">
        {{ siteSettings.settings()?.webName ?? 'สาขาวิทยาการคอมพิวเตอร์' }}
      </a>

      <nav class="flex items-center gap-4 text-sm">
        <a
          routerLink="/"
          routerLinkActive="font-semibold text-slate-900"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-slate-600 hover:text-slate-900"
          >หน้าแรก</a
        >

        @if (auth.isLoggedIn()) {
          @if (auth.isAdmin()) {
            <a routerLink="/admin" class="text-slate-600 hover:text-slate-900">จัดการระบบ</a>
          }
          <span class="text-slate-500">{{ auth.user()?.fullName }}</span>
          <button type="button" app-button variant="secondary" size="sm" (click)="auth.logout()">ออกจากระบบ</button>
        } @else {
          <a routerLink="/login" app-button size="sm">เข้าสู่ระบบ</a>
        }
      </nav>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 bg-white py-4 text-center text-sm text-slate-500">
    มหาวิทยาลัยราชภัฏกาญจนบุรี
  </footer>
</div>
