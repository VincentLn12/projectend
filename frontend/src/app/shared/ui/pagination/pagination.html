<div class="flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600">
  <p>{{ summary() }}</p>

  @if (totalPages() > 1) {
    <nav aria-label="แบ่งหน้า" class="flex flex-wrap items-center gap-1">
      <button
        type="button"
        app-button
        variant="secondary"
        size="sm"
        [disabled]="page() <= 1"
        (click)="go(page() - 1)"
      >
        ก่อนหน้า
      </button>

      @for (item of pages(); track $index) {
        @if (item === null) {
          <span class="px-2 text-slate-400" aria-hidden="true">…</span>
        } @else {
          <button
            type="button"
            app-button
            size="sm"
            [variant]="item === page() ? 'primary' : 'ghost'"
            [attr.aria-current]="item === page() ? 'page' : null"
            (click)="go(item)"
          >
            {{ item }}
          </button>
        }
      }

      <button
        type="button"
        app-button
        variant="secondary"
        size="sm"
        [disabled]="page() >= totalPages()"
        (click)="go(page() + 1)"
      >
        ถัดไป
      </button>
    </nav>
  }
</div>
