<div role="tablist" [attr.aria-label]="label()" class="flex gap-2 border-b-2 border-slate-300/80">
  @for (tab of tabs(); track tab.key) {
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="tab.key === value()"
      [attr.tabindex]="tab.key === value() ? 0 : -1"
      class="-mb-0.5 flex items-center gap-2.5 border-b-4 px-4 pb-3 pt-2 text-lg font-semibold transition-colors focus:outline-none focus-visible:rounded-t-lg focus-visible:ring-2 focus-visible:ring-brand-700 sm:px-6"
      [class]="
        tab.key === value()
          ? 'border-gold-400 text-brand-900'
          : 'border-transparent text-slate-500 hover:border-slate-400 hover:text-slate-800'
      "
      (click)="choose(tab.key)"
      (keydown.arrowRight)="moveBy(1, $event)"
      (keydown.arrowLeft)="moveBy(-1, $event)"
    >
      <span>{{ tab.label }}</span>
      @if (tab.count !== undefined && tab.count !== null) {
        <span
          class="min-w-7 rounded-full px-2 py-0.5 text-center text-sm font-bold"
          [class]="tab.key === value() ? 'bg-brand-900 text-white' : 'bg-slate-300/70 text-slate-700'"
        >
          {{ tab.count }}
        </span>
      }
    </button>
  }
</div>
