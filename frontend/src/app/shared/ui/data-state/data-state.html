@if (loading()) {
  <div role="status" class="flex items-center justify-center gap-3 py-10 text-slate-500">
    <svg class="size-5 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
    </svg>
    {{ loadingMessage() }}
  </div>
} @else if (error(); as message) {
  <div role="alert" class="rounded-lg border border-red-200 bg-red-50 p-6 text-center">
    <p class="text-red-700">{{ message }}</p>
    <button type="button" app-button variant="secondary" size="sm" class="mt-3" (click)="retry.emit()">ลองใหม่</button>
  </div>
} @else if (empty()) {
  <div class="rounded-lg border border-dashed border-slate-300 py-10 text-center text-slate-500">
    {{ emptyMessage() }}
  </div>
} @else {
  <ng-content />
}
