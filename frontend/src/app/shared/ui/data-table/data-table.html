<app-data-state
  [loading]="loading()"
  [error]="error()"
  [empty]="rows().length === 0"
  [emptyMessage]="emptyMessage()"
  (retry)="retry.emit()"
>
  <!-- Wide screens: a table. Phones: every row becomes a card whose cells show their column header as a label. -->
  <div class="md:overflow-x-auto md:rounded-xl md:bg-white md:shadow-sm md:ring-1 md:ring-slate-300">
    <table class="block w-full text-base md:table">
      <thead class="bg-brand-900 max-md:sr-only">
        <tr>
          @for (column of columns(); track column.key) {
            <th
              scope="col"
              class="whitespace-nowrap px-5 py-3.5 text-sm font-semibold text-white"
              [class]="alignClass(column)"
            >
              {{ column.header }}
            </th>
          }
        </tr>
      </thead>
      <tbody class="block md:table-row-group md:divide-y md:divide-slate-200">
        @for (row of rows(); track trackBy()(row, $index); let index = $index) {
          <tr
            class="block transition-colors odd:bg-white even:bg-slate-50 hover:bg-sky-100 md:table-row max-md:mb-3 max-md:overflow-hidden max-md:rounded-xl max-md:bg-white max-md:shadow-sm max-md:ring-1 max-md:ring-slate-300"
          >
            @for (column of columns(); track column.key) {
              <td
                class="block px-5 py-3.5 align-middle text-slate-800 md:table-cell max-md:flex max-md:items-start max-md:justify-between max-md:gap-4 max-md:border-b max-md:border-slate-200 max-md:px-4 max-md:py-3 max-md:before:shrink-0 max-md:before:text-sm max-md:before:font-medium max-md:before:text-slate-500 max-md:before:content-[attr(data-label)] max-md:first:border-b-2 max-md:first:border-brand-800 max-md:first:bg-slate-100 max-md:first:font-semibold max-md:first:text-slate-900 max-md:first:before:hidden max-md:last:border-b-0"
                [class]="cellClasses(column)"
                [attr.data-label]="column.header"
              >
                @if (templateFor(column.key); as cell) {
                  <ng-container
                    [ngTemplateOutlet]="cell"
                    [ngTemplateOutletContext]="{ $implicit: row, row: row, index: index }"
                  />
                } @else {
                  {{ display(column, row) }}
                }
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</app-data-state>
