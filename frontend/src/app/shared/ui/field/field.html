@if (label()) {
  <label [attr.for]="inputId()" class="mb-1 block text-sm font-medium text-slate-700">
    {{ label() }}
    @if (required()) {
      <span class="text-red-600" aria-hidden="true">*</span>
    }
  </label>
}

<ng-content />

@if (error(); as message) {
  <p [id]="inputId() + '-error'" class="mt-1 text-sm text-red-600" role="alert">{{ message }}</p>
} @else if (hint()) {
  <p [id]="inputId() + '-hint'" class="mt-1 text-sm text-slate-500">{{ hint() }}</p>
}
