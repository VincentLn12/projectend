<app-field [hint]="hint()" [error]="errorMessage()" [inputId]="uid">
  <label class="flex items-start gap-2 text-sm text-slate-700">
    <input
      [id]="uid"
      type="checkbox"
      [checked]="value() === true"
      [disabled]="isDisabled()"
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      class="mt-0.5 size-4 rounded border-slate-300 text-slate-900 focus:ring-2 focus:ring-slate-200"
      (change)="onChecked($event)"
    />
    <span>{{ label() }}</span>
  </label>
</app-field>
