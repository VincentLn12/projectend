<div [class]="boxClass()">
  <app-field [hint]="shownHint()" [error]="errorMessage()" [inputId]="uid">
    <div class="flex items-center gap-3">
      <button
        [id]="uid"
        type="button"
        role="switch"
        [attr.aria-checked]="value() === true"
        [attr.aria-describedby]="describedBy()"
        [disabled]="isDisabled()"
        (click)="flip()"
        class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300 disabled:cursor-not-allowed disabled:opacity-60"
        [class]="value() === true ? (tone() === 'success' ? 'bg-emerald-600' : tone() === 'info' ? 'bg-blue-600' : 'bg-slate-900') : 'bg-slate-300'"
      >
        <span
          class="inline-block size-5 rounded-full bg-white shadow transition-transform"
          [class]="value() === true ? 'translate-x-5' : 'translate-x-0.5'"
        ></span>
      </button>
      @if (label()) {
        <label [attr.for]="uid" class="text-sm text-slate-700">{{ label() }}</label>
      }
    </div>
  </app-field>
</div>
