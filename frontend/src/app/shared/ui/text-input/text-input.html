<app-field [label]="label()" [hint]="hint()" [error]="errorMessage()" [required]="isRequired()" [inputId]="uid">
  <div class="relative">
    <input
      [id]="uid"
      [type]="inputType()"
      [value]="value() ?? ''"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxLength()"
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [class]="inputClass(!!errorMessage())"
      (input)="onInput($event)"
      (blur)="markTouched()"
    />
    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePassword()"
        class="absolute inset-y-0 right-0 px-3 text-sm text-slate-500 hover:text-slate-800"
        [attr.aria-pressed]="showPassword()"
      >
        {{ showPassword() ? 'ซ่อน' : 'แสดง' }}
      </button>
    }
  </div>
</app-field>
