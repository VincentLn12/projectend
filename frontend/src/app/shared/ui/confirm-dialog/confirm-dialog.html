<dialog
  #dialog
  class="m-auto w-full max-w-md rounded-xl p-0 shadow-xl backdrop:bg-slate-900/40"
  aria-labelledby="confirm-dialog-title"
  (cancel)="onCancel($event)"
  (click)="onBackdropClick($event)"
>
  @if (confirm.current(); as request) {
    <div class="p-6">
      <h2 id="confirm-dialog-title" class="text-lg font-semibold text-slate-900">{{ request.options.title }}</h2>
      @if (request.options.message) {
        <p class="mt-2 text-sm text-slate-600">{{ request.options.message }}</p>
      }

      <div class="mt-6 flex justify-end gap-2">
        <button type="button" app-button variant="secondary" autofocus (click)="confirm.answer(false)">
          {{ request.options.cancelText ?? 'ยกเลิก' }}
        </button>
        <button
          type="button"
          app-button
          [variant]="request.options.danger ? 'danger' : 'primary'"
          (click)="confirm.answer(true)"
        >
          {{ request.options.confirmText ?? 'ยืนยัน' }}
        </button>
      </div>
    </div>
  }
</dialog>
