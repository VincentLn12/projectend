<section class="mx-auto max-w-sm rounded-xl bg-white p-8 shadow-sm">
  <h1 class="text-xl font-semibold text-slate-900">เข้าสู่ระบบ</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
    <app-text-input
      label="อีเมล ชื่อผู้ใช้ หรือรหัสนักศึกษา"
      formControlName="identifier"
      autocomplete="username"
    />
    <app-text-input
      label="รหัสผ่าน"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />

    @if (errorMessage(); as message) {
      <p role="alert" class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ message }}</p>
    }

    <button type="submit" app-button class="w-full" [loading]="submitting()">
      {{ submitting() ? 'กำลังเข้าสู่ระบบ…' : 'เข้าสู่ระบบ' }}
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-slate-600">
    ยังไม่มีบัญชี? <a routerLink="/register" class="font-semibold text-brand-800 underline">สมัครสมาชิก (นักศึกษา)</a>
  </p>
</section>
