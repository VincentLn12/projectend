<section class="rounded-xl bg-white p-8 shadow-sm">
  @if (siteSettings.settings(); as settings) {
    <h1 class="text-2xl font-semibold text-slate-900">{{ settings.webName }}</h1>
    <p class="mt-2 text-slate-600">มหาวิทยาลัยราชภัฏกาญจนบุรี</p>

    <div class="mt-6 flex flex-wrap gap-3 text-sm">
      @if (settings.registerUrl) {
        <a
          [href]="settings.registerUrl"
          target="_blank"
          rel="noopener"
          class="rounded-md bg-slate-900 px-4 py-2 text-white hover:bg-slate-700"
          >สมัครเรียน</a
        >
      }
      @if (settings.pageFacebook) {
        <a
          [href]="settings.pageFacebook"
          target="_blank"
          rel="noopener"
          class="rounded-md border border-slate-300 px-4 py-2 text-slate-700 hover:bg-slate-100"
          >Facebook</a
        >
      }
    </div>
  } @else if (siteSettings.loadFailed()) {
    <p class="text-red-600">เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่ภายหลัง</p>
  } @else {
    <p class="text-slate-500">กำลังโหลด…</p>
  }
</section>
