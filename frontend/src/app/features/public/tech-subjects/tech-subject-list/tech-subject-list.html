<section class="space-y-6">
  <h1 class="text-2xl font-semibold text-slate-900">เทคโนโลยีที่เรียน</h1>

  <app-data-state
    [loading]="loading()"
    [error]="error()"
    [empty]="!loading() && subjects().length === 0"
    emptyMessage="ยังไม่มีข้อมูล"
    (retry)="load()"
  >
    <ul class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (subject of subjects(); track subject.id) {
        <li class="overflow-hidden rounded-xl bg-white shadow-sm transition hover:shadow-md">
          <a [routerLink]="['/tech-subjects', subject.id]" class="block">
            <app-file-image [fileId]="subject.mainImageFileId" [alt]="subject.subjectName" class="h-40 w-full" />
            <div class="space-y-1 p-4">
              <h2 class="font-semibold text-slate-900">{{ subject.subjectName }}</h2>
              @if (subject.subTitle) {
                <p class="line-clamp-2 text-sm text-slate-600">{{ subject.subTitle }}</p>
              }
            </div>
          </a>
        </li>
      }
    </ul>
  </app-data-state>
</section>
