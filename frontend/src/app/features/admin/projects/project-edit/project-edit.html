<section class="mx-auto max-w-3xl space-y-4">
  <div class="flex items-baseline justify-between gap-3">
    <h1 class="text-xl font-semibold text-slate-900">{{ isNew ? 'เพิ่มโครงงาน' : 'แก้ไขโครงงาน' }}</h1>
    <a routerLink="/admin/projects" class="text-sm text-slate-600 underline hover:text-slate-900">← กลับไปรายการโครงงาน</a>
  </div>

  <app-data-state [loading]="loading()" [error]="loadError()" (retry)="load()">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4 rounded-xl bg-white p-6 shadow-sm">
      <app-text-input label="ชื่อโครงงาน (ไทย)" formControlName="nameTH" [maxLength]="300" />
      <app-text-input label="ชื่อโครงงาน (อังกฤษ)" formControlName="nameEN" [maxLength]="300" />
      <app-text-area label="รายละเอียด" formControlName="description" [rows]="6" />

      <div class="grid gap-4 sm:grid-cols-2">
        <app-text-input label="ปีการศึกษา (พ.ศ.)" type="number" formControlName="academicYear" />
        <app-select-input label="นักศึกษาเจ้าของโครงงาน" formControlName="studentId" [options]="studentOptions()" />
        <app-select-input label="อาจารย์ที่ปรึกษาหลัก" formControlName="mainAdvisorId" [options]="lecturerOptions()" />
        <app-select-input label="อาจารย์ที่ปรึกษาร่วม" formControlName="coAdvisorId" [options]="lecturerOptions()" />
      </div>

      <app-text-input label="คำสำคัญ" hint="คั่นด้วยเครื่องหมายจุลภาค" formControlName="keyWords" [maxLength]="500" />
      <app-text-input label="ลิงก์วิดีโอ" type="url" formControlName="videoUrl" />
      <app-text-input label="ลิงก์เว็บไซต์" type="url" formControlName="webUrl" />
      <app-text-input label="ลิงก์ GitHub" type="url" formControlName="githubUrl" />

      <app-file-upload label="รูปภาพโครงงาน" formControlName="imageFileId" accept="image" />
      <app-file-upload label="เอกสาร PDF" formControlName="pdfFileId" accept="pdf" />
      <app-toggle label="เผยแพร่ทันที" formControlName="isPublished" />

      @if (formError(); as message) {
        <p role="alert" class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ message }}</p>
      }

      <div class="flex justify-end gap-2">
        <a app-button variant="secondary" routerLink="/admin/projects">ยกเลิก</a>
        <button type="submit" app-button [loading]="saving()">บันทึก</button>
      </div>
    </form>
  </app-data-state>
</section>
