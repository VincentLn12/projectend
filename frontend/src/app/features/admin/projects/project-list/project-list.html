<section class="space-y-4">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">จัดการโครงงาน</h1>
      <p class="text-base text-slate-500">ทั้งหมด {{ list.total() }} โครงงาน</p>
    </div>
    <a app-button routerLink="/admin/projects/new">เพิ่มโครงงาน</a>
  </div>

  <div class="flex flex-wrap items-end gap-3">
    <div class="min-w-60 flex-1">
      <app-search-box placeholder="ค้นหาชื่อโครงงานหรือชื่อนักศึกษา" (searchChange)="list.setSearch($event)" />
    </div>
    <div class="w-[calc(50%-0.375rem)] sm:w-44">
      <app-select-input
        label="ปีการศึกษา"
        shape="soft"
        placeholder="ทุกปี"
        [options]="yearOptions()"
        [formControl]="yearControl"
      />
    </div>
    <div class="w-[calc(50%-0.375rem)] sm:w-44">
      <app-select-input
        label="สถานะ"
        shape="soft"
        placeholder="ทุกสถานะ"
        [options]="statusOptions"
        [formControl]="statusControl"
      />
    </div>
    @if (hasFilters()) {
      <button type="button" app-button variant="ghost" class="rounded-lg" (click)="clearFilters()">ล้างตัวกรอง</button>
    }
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="list.items()"
    [trackBy]="rowKey"
    [loading]="list.loading()"
    [error]="list.error()"
    [emptyMessage]="hasFilters() || list.search() ? 'ไม่พบโครงงานที่ตรงกับตัวกรอง' : 'ยังไม่มีโครงงาน'"
    (retry)="list.reload()"
  >
    <ng-template appCell="nameTH" let-row>
      <a [routerLink]="['/admin/projects', row.id]" class="font-medium text-slate-900 hover:underline">{{ row.nameTH }}</a>
    </ng-template>
    <ng-template appCell="status" let-row>
      <span
        class="rounded-full px-2.5 py-0.5 text-sm font-medium"
        [class]="row.isPublished ? 'bg-green-600 text-white' : 'bg-slate-500 text-white'"
        >{{ row.isPublished ? 'เผยแพร่' : 'ฉบับร่าง' }}</span
      >
    </ng-template>
    <ng-template appCell="actions" let-row>
      <div class="flex flex-wrap justify-end gap-1.5">
        <button type="button" app-button size="sm" variant="ghost" (click)="togglePublished(row)">
          {{ row.isPublished ? 'ยกเลิกเผยแพร่' : 'เผยแพร่' }}
        </button>
        <a app-button size="sm" variant="secondary" [routerLink]="['/admin/projects', row.id]">แก้ไข</a>
        <button type="button" app-button size="sm" variant="danger" (click)="askToDelete(row)">ลบ</button>
      </div>
    </ng-template>
  </app-data-table>

  <app-pagination [page]="list.page()" [pageSize]="list.pageSize" [total]="list.total()" (pageChange)="list.setPage($event)" />
</section>
