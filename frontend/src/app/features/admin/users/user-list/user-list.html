<section class="space-y-4">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <h1 class="text-xl font-semibold text-slate-900">จัดการผู้ใช้</h1>
    <div class="flex flex-wrap items-end gap-3">
      <div class="w-48"><app-select-input [formControl]="userType" [options]="typeOptions" placeholder="ทุกประเภท" /></div>
      <div class="w-64"><app-search-box placeholder="ค้นหาชื่อ อีเมล หรือรหัสนักศึกษา" (searchChange)="list.setSearch($event)" /></div>
      <a app-button routerLink="/admin/users/new">เพิ่มผู้ใช้</a>
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="list.items()"
    [trackBy]="rowKey"
    [loading]="list.loading()"
    [error]="list.error()"
    emptyMessage="ไม่พบผู้ใช้"
    (retry)="list.reload()"
  >
    <ng-template appCell="fullName" let-row>
      <a [routerLink]="['/admin/users', row.id]" class="font-medium text-slate-900 hover:underline">{{ row.fullName }}</a>
    </ng-template>
    <ng-template appCell="status" let-row>
      <span
        class="rounded-full px-2.5 py-0.5 text-sm font-medium"
        [class]="row.isLocked ? 'bg-red-600 text-white' : 'bg-green-600 text-white'"
        >{{ row.isLocked ? 'ถูกล็อก' : 'ใช้งานได้' }}</span
      >
    </ng-template>
    <ng-template appCell="actions" let-row>
      <div class="flex flex-wrap justify-end gap-1.5">
        <button type="button" app-button size="sm" variant="ghost" (click)="toggleLocked(row)">
          {{ row.isLocked ? 'ปลดล็อก' : 'ล็อก' }}
        </button>
        <a app-button size="sm" variant="secondary" [routerLink]="['/admin/users', row.id]">แก้ไข</a>
        <button type="button" app-button size="sm" variant="danger" (click)="askToDelete(row)">ลบ</button>
      </div>
    </ng-template>
  </app-data-table>

  <app-pagination [page]="list.page()" [pageSize]="list.pageSize" [total]="list.total()" (pageChange)="list.setPage($event)" />
</section>
