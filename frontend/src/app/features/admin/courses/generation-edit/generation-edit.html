<section class="space-y-4">
  <div class="flex items-baseline justify-between gap-3">
    <h1 class="text-xl font-semibold text-slate-900">{{ isNew ? 'เพิ่มรุ่นอบรม' : 'แก้ไขรุ่นอบรม' }}</h1>
    <a [routerLink]="['/admin/courses', courseId]" class="text-sm text-slate-600 underline hover:text-slate-900">← กลับไปหลักสูตร</a>
  </div>

  <app-data-state [loading]="loading()" [error]="loadError()" (retry)="load()">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4 rounded-xl bg-white p-6 shadow-sm">
      <app-text-input label="ชื่อรุ่น" formControlName="subTitle" [maxLength]="300" />
      <app-text-area label="รายละเอียด" formControlName="description" [rows]="4" />
      <div class="grid gap-4 sm:grid-cols-2">
        <app-date-input label="เริ่มอบรม" type="datetime-local" formControlName="startDate" />
        <app-date-input label="สิ้นสุดการอบรม" type="datetime-local" formControlName="endDate" />
        <app-text-input label="จำนวนที่รับ" type="number" formControlName="quantity" />
        <app-text-input label="ค่าลงทะเบียน (บาท)" hint="เว้นว่างถ้าไม่มีค่าใช้จ่าย" type="number" formControlName="fee" />
      </div>
      <app-file-upload label="รูปภาพรุ่น" formControlName="photoFileId" accept="image" />
      <app-toggle label="ยกเลิกรุ่นนี้" formControlName="isCancelled" />

      @if (formError(); as message) {
        <p role="alert" class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ message }}</p>
      }

      <div class="flex justify-end gap-2">
        <a app-button variant="secondary" [routerLink]="['/admin/courses', courseId]">ยกเลิก</a>
        <button type="submit" app-button [loading]="saving()">บันทึก</button>
      </div>
    </form>
  </app-data-state>
</section>
