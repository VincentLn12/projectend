<section class="mx-auto max-w-3xl space-y-4">
  <div class="flex items-baseline justify-between gap-3">
    <h1 class="text-xl font-semibold text-slate-900">{{ isNew ? 'เพิ่มแบนเนอร์' : 'แก้ไขแบนเนอร์' }}</h1>
    <a routerLink="/admin/home-banners" class="text-sm text-slate-600 underline hover:text-slate-900">← กลับไปรายการแบนเนอร์</a>
  </div>

  <app-data-state [loading]="loading()" [error]="loadError()" (retry)="load()">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4 rounded-xl bg-white p-6 shadow-sm">
      <app-text-input label="ชื่อ" formControlName="title" [maxLength]="200" />
      <app-file-upload label="รูปแบนเนอร์" formControlName="fileId" accept="image" />
      <app-text-input label="ลิงก์เมื่อคลิก" formControlName="linkUrl" type="url" />
      <app-text-input label="ลำดับการแสดง" hint="เลขน้อยแสดงก่อน" formControlName="sortOrder" type="number" />
      <app-toggle label="เผยแพร่" formControlName="isPublished" />

      @if (formError(); as message) {
        <p role="alert" class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ message }}</p>
      }

      <div class="flex justify-end gap-2">
        <a app-button variant="secondary" routerLink="/admin/home-banners">ยกเลิก</a>
        <button type="submit" app-button [loading]="saving()">บันทึก</button>
      </div>
    </form>
  </app-data-state>
</section>
