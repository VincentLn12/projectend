<section class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-semibold text-slate-900">จัดการแบนเนอร์หน้าแรก</h1>
    <div class="flex items-center gap-3">
      <a app-button routerLink="/admin/home-banners/new">เพิ่มแบนเนอร์</a>
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    (retry)="load()"
    [trackBy]="rowKey"
    emptyMessage="ยังไม่มีแบนเนอร์"
  >
    <ng-template appCell="title" let-row>
      <a [routerLink]="['/admin/home-banners', row.id]" class="font-medium text-slate-900 hover:underline">{{ row.title || '(ไม่มีชื่อ)' }}</a>
    </ng-template>
    <ng-template appCell="status" let-row>
      <span
        class="rounded-full px-2.5 py-0.5 text-sm font-medium"
        [class]="row.isPublished ? 'bg-green-100 text-green-800' : 'bg-slate-100 text-slate-600'"
        >{{ row.isPublished ? 'เผยแพร่' : 'ฉบับร่าง' }}</span
      >
    </ng-template>
    <ng-template appCell="actions" let-row>
      <div class="flex flex-wrap justify-end gap-1.5">
        <button type="button" app-button size="sm" variant="ghost" (click)="togglePublished(row)">
          {{ row.isPublished ? 'ยกเลิกเผยแพร่' : 'เผยแพร่' }}
        </button>
        <a app-button size="sm" variant="secondary" [routerLink]="['/admin/home-banners', row.id]">แก้ไข</a>
        <button type="button" app-button size="sm" variant="danger" (click)="askToDelete(row)">ลบ</button>
      </div>
    </ng-template>
  </app-data-table>
</section>
