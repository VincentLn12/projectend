<section class="space-y-4">
  <app-page-header
    title="ข้อมูลนักศึกษา"
    description="ข้อมูลมาจากการจัดการผู้ใช้งาน (ประเภทนักศึกษา) กดที่ชื่อเพื่อดูโครงงานและประวัติการทำงาน"
    [count]="list.total()"
    unit="คน"
  >
    <a app-button variant="accent" routerLink="/admin/users/new">เพิ่มผู้ใช้งาน</a>
  </app-page-header>

  <div class="flex flex-wrap items-end gap-3">
    <div class="min-w-60 flex-1">
      <app-search-box placeholder="ค้นหาชื่อ รหัสนักศึกษา หรืออีเมล" (searchChange)="list.setSearch($event)" />
    </div>
    <div class="w-[calc(50%-0.375rem)] sm:w-44">
      <app-select-input
        label="ปีที่เข้าเรียน"
        shape="soft"
        placeholder="ทุกปี"
        [options]="yearOptions()"
        [formControl]="yearControl"
      />
    </div>
    <div class="w-[calc(50%-0.375rem)] sm:w-44">
      <app-select-input
        label="สถานะบัญชี"
        shape="soft"
        placeholder="ทุกสถานะ"
        [options]="statusOptions"
        [formControl]="statusControl"
      />
    </div>
    @if (hasFilters()) {
      <button type="button" app-button variant="ghost" class="rounded-lg" (click)="clearFilters()">ล้างตัวกรอง</button>
    }
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="list.items()"
    [trackBy]="rowKey"
    [loading]="list.loading()"
    [error]="list.error()"
    [sort]="list.sort()"
    [emptyMessage]="hasFilters() || list.search() ? 'ไม่พบนักศึกษาที่ตรงกับตัวกรอง' : 'ยังไม่มีข้อมูลนักศึกษา'"
    (sortChange)="list.toggleSort($event)"
    (retry)="list.reload()"
  >
    <ng-template appCell="fullName" let-row>
      <div class="flex items-center gap-3">
        <app-file-image
          [fileId]="row.imageFileId"
          [alt]="row.fullName"
          class="size-10 shrink-0 rounded-full ring-1 ring-slate-200"
        />
        <a [routerLink]="['/admin/students', row.id]" class="font-medium text-slate-900 hover:underline">{{ row.fullName }}</a>
      </div>
    </ng-template>
    <ng-template appCell="status" let-row>
      <span
        class="rounded-full px-2.5 py-0.5 text-sm font-medium text-white"
        [class]="row.isLocked ? 'bg-red-600' : 'bg-green-600'"
        >{{ row.isLocked ? 'ถูกล็อก' : 'ใช้งานได้' }}</span
      >
    </ng-template>
    <ng-template appCell="actions" let-row>
      <div class="flex flex-wrap justify-end gap-1.5">
        <a app-button size="sm" variant="secondary" [routerLink]="['/admin/students', row.id]">ดูรายละเอียด</a>
        <a app-button size="sm" variant="ghost" [routerLink]="['/admin/users', row.id]">แก้ไขข้อมูล</a>
      </div>
    </ng-template>
  </app-data-table>

  <app-pagination [page]="list.page()" [pageSize]="list.pageSize" [total]="list.total()" (pageChange)="list.setPage($event)" />
</section>
