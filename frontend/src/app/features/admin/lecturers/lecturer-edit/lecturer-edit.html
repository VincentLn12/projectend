<section class="mx-auto max-w-3xl space-y-4">
  <div class="flex items-baseline justify-between gap-3">
    <h1 class="text-xl font-semibold text-slate-900">{{ isNew ? 'เพิ่มอาจารย์' : 'แก้ไขข้อมูลอาจารย์' }}</h1>
    <a routerLink="/admin/lecturers" class="text-sm text-slate-600 underline hover:text-slate-900">← กลับไปรายการอาจารย์</a>
  </div>

  <app-data-state [loading]="loading()" [error]="loadError()" (retry)="load()">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4 rounded-xl bg-white p-6 shadow-sm">
      <div class="grid gap-4 sm:grid-cols-3">
        <app-text-input label="คำนำหน้า / ตำแหน่งทางวิชาการ" formControlName="prefix" [maxLength]="50" />
        <div class="sm:col-span-2"><app-text-input label="ชื่อ-สกุล" formControlName="fullName" [maxLength]="200" /></div>
      </div>
      <app-text-input label="ตำแหน่ง" formControlName="position" [maxLength]="200" />
      <app-text-input label="ความเชี่ยวชาญ" formControlName="expertise" [maxLength]="500" />
      <div class="grid gap-4 sm:grid-cols-2">
        <app-text-input label="วุฒิการศึกษา" formControlName="educationLevel" [maxLength]="100" />
        <app-text-input label="สาขา/หลักสูตรที่สอน" formControlName="program" [maxLength]="200" />
      </div>
      <app-text-input label="ช่องทางติดต่อ" formControlName="contact" [maxLength]="300" />
      <app-file-upload label="รูปภาพ" formControlName="imageFileId" accept="image" />
      <app-text-input label="ลำดับการแสดง" hint="เลขน้อยแสดงก่อน" type="number" formControlName="sortOrder" />
      <app-toggle label="เผยแพร่" formControlName="isPublished" />

      @if (formError(); as message) {
        <p role="alert" class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ message }}</p>
      }

      <div class="flex justify-end gap-2">
        <a app-button variant="secondary" routerLink="/admin/lecturers">ยกเลิก</a>
        <button type="submit" app-button [loading]="saving()">บันทึก</button>
      </div>
    </form>
  </app-data-state>
</section>
