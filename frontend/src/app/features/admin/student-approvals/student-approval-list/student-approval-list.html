<section class="space-y-4">
  <div>
    <h1 class="text-xl font-semibold text-slate-900">อนุมัตินักศึกษาที่สมัครเอง</h1>
    <p class="text-sm text-slate-600">ตรวจสอบว่าผู้สมัครเป็นเจ้าของรหัสนักศึกษาตัวจริง แล้วกดอนุมัติ เพื่อให้ใช้ระบบโครงงานนักศึกษาได้</p>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [trackBy]="rowKey"
    [loading]="loading()"
    [error]="error()"
    emptyMessage="ไม่มีคำขอที่รออนุมัติ"
    (retry)="load()"
  >
    <ng-template appCell="registeredAt" let-row>{{ row.registeredAt | thaiDate: 'short' }}</ng-template>
    <ng-template appCell="actions" let-row>
      <div class="flex flex-wrap justify-end gap-1.5">
        <button type="button" app-button size="sm" variant="primary" (click)="approve(row)">อนุมัติ</button>
        <button type="button" app-button size="sm" variant="danger" (click)="reject(row)">ปฏิเสธ</button>
      </div>
    </ng-template>
  </app-data-table>
</section>
