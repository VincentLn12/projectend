<section class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-semibold text-slate-900">จัดการข่าว</h1>
    <a app-button routerLink="/admin/news/new">เพิ่มข่าว</a>
  </div>

  <div class="flex flex-wrap items-end gap-3">
    <div class="min-w-60 flex-1">
      <app-search-box placeholder="ค้นหาหัวข้อข่าว" (searchChange)="list.setSearch($event)" />
    </div>
    <div class="w-44">
      <app-select-input
        label="สถานะ"
        shape="soft"
        placeholder="ทุกสถานะ"
        [options]="statusOptions"
        [formControl]="statusControl"
      />
    </div>
    <div class="w-44">
      <app-date-input
        label="เผยแพร่ตั้งแต่วันที่"
        shape="soft"
        [max]="publishedToControl.value"
        [formControl]="publishedFromControl"
      />
    </div>
    <div class="w-44">
      <app-date-input
        label="ถึงวันที่"
        shape="soft"
        [min]="publishedFromControl.value"
        [formControl]="publishedToControl"
      />
    </div>
    @if (hasFilters()) {
      <button type="button" app-button variant="ghost" class="rounded-lg" (click)="clearFilters()">ล้างตัวกรอง</button>
    }
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="list.items()"
    [trackBy]="rowKey"
    [loading]="list.loading()"
    [error]="list.error()"
    [sort]="list.sort()"
    [emptyMessage]="hasFilters() || list.search() ? 'ไม่พบข่าวที่ตรงกับตัวกรอง' : 'ยังไม่มีข่าว'"
    (sortChange)="list.toggleSort($event)"
    (retry)="list.reload()"
  >
    <ng-template appCell="title" let-row>
      <a
        [routerLink]="['/admin/news', row.id]"
        class="font-medium text-slate-900 hover:underline"
        >{{ row.title }}</a
      >
    </ng-template>
    <ng-template appCell="status" let-row>
      <span
        class="rounded-full px-2.5 py-0.5 text-sm font-medium"
        [class]="row.isPublished ? 'bg-green-600 text-white' : 'bg-slate-500 text-white'"
        >{{ row.isPublished ? 'เผยแพร่' : 'ฉบับร่าง' }}</span
      >
    </ng-template>
    <ng-template appCell="publishedAt" let-row>
      {{ row.publishedAt | thaiDate }}
    </ng-template>
    <ng-template appCell="actions" let-row>
      <div class="flex flex-wrap justify-end gap-1.5">
        <button type="button" app-button size="sm" variant="ghost" (click)="togglePublished(row)">
          {{ row.isPublished ? 'ยกเลิกเผยแพร่' : 'เผยแพร่' }}
        </button>
        <a app-button size="sm" variant="secondary" [routerLink]="['/admin/news', row.id]">แก้ไข</a>
        <button type="button" app-button size="sm" variant="danger" (click)="askToDelete(row)">
          ลบ
        </button>
      </div>
    </ng-template>
  </app-data-table>

  <app-pagination
    [page]="list.page()"
    [pageSize]="list.pageSize"
    [total]="list.total()"
    (pageChange)="list.setPage($event)"
  />
</section>
